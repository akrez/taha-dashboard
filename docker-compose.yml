services:
  var_www_html:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8087}:8080"
    volumes:
      - ./:/var/www/html
    environment:
      PHP_MEMORY_LIMIT: "1024M"
  mariadb:
    image: mariadb:10.4
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"